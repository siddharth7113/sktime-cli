name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Run pre-commit
        run: uvx pre-commit run --all-files

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra docs
      # -W matches Read the Docs, which builds with fail_on_warning.
      - name: Build the documentation
        run: uv run sphinx-build -b html -W docs docs/_build/html

  # The skill is authored at the repo root and copied into the package by
  # force-include. Only a real build proves that mapping still holds, so check
  # the built wheel rather than trusting the config.
  wheel:
    name: Wheel carries the skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: uv build --wheel --out-dir dist
      - name: Check the skill landed at the package-bundled path
        run: |
          python - <<'EOF'
          import glob, sys, zipfile

          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          expected = "sktime_cli/.agents/skills/sktime-cli/SKILL.md"
          names = zipfile.ZipFile(wheel).namelist()
          if expected not in names:
              sys.exit(f"{wheel} is missing {expected}")
          print(f"{wheel} carries {expected}")
          EOF

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest -n auto

  # The Python matrix alone cannot catch an sktime release changing behaviour
  # under us, so pin the sktime axis too: the declared floor, and the newest
  # release. Both are blocking; a break here is a break for users.
  sktime-versions:
    name: Test (sktime ${{ matrix.sktime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sktime: "1.1.0"
            spec: "sktime==1.1.0"
          - sktime: "latest"
            spec: "sktime"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Pin sktime to ${{ matrix.sktime }}
        run: uv pip install --upgrade "${{ matrix.spec }}"
      - name: Report the resolved version
        run: uv run sktime-cli version
      - name: Run tests
        run: uv run pytest -n auto

  # Early warning only: sktime main and upstream deprecations are allowed to
  # break without failing the build, so the signal arrives before a release
  # turns it into a user-visible bug.
  upstream-drift:
    name: Advisory - upstream drift (${{ matrix.check }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        check: [sktime-main, deprecations]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Install sktime from main
        if: matrix.check == 'sktime-main'
        run: uv pip install --upgrade "sktime @ git+https://github.com/sktime/sktime.git@main"
      - name: Run tests
        if: matrix.check == 'sktime-main'
        run: uv run pytest -n auto
      # Turn upstream deprecation warnings into failures, so a scheduled
      # removal is visible while there is still time to act on it.
      #
      # The ignore list is deprecations already seen and accepted; without it
      # this job would stay red until the removal lands and would hide the
      # next one. Each entry names the release that clears it, and expires by
      # itself: once upstream removes the tag the warning stops, the filter
      # matches nothing, and anything new turns the job red again.
      #
      # Accepted:
      #   capability:global_forecasting - skbase warns while collecting tags on
      #     any class declaring it. sktime-cli neither sets nor reads the tag,
      #     so there is nothing to change here; sktime 1.2.0 removes it.
      - name: Run tests with deprecations as errors
        if: matrix.check == 'deprecations'
        run: uv run pytest -n auto -o $'filterwarnings=\n    error::FutureWarning\n    error::DeprecationWarning\n    ignore:tag .capability.global_forecasting. will be removed:FutureWarning'

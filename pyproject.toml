[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sktime-cli"
version = "0.0.2"
description = "Command-line interface for sktime, designed for AI agents and humans"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Siddharth", email = "siddharth.siddharth@ecospecs.de" }]
requires-python = ">=3.10,<3.15"
dependencies = [
  "sktime>=1.1,<2.0",
  "typer>=0.12",
  "rich>=13",
  "platformdirs>=3.0",
]
keywords = ["time-series", "sktime", "cli", "forecasting", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://sktime-cli.readthedocs.io"
Documentation = "https://sktime-cli.readthedocs.io"
Repository = "https://github.com/siddharth7113/sktime-cli"
Issues = "https://github.com/siddharth7113/sktime-cli/issues"
Changelog = "https://github.com/siddharth7113/sktime-cli/blob/main/CHANGELOG.md"

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
docs = [
  "sphinx>=7.2",
  "myst-parser>=3.0",
  "pydata-sphinx-theme>=0.15",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.6",
  "sphinxcontrib-mermaid>=0.9",
]

[project.scripts]
sktime-cli = "sktime_cli.app:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-xdist",
  "ruff",
  "pre-commit",
  "pyarrow>=14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sktime_cli"]

# The skill is authored at the repo root, where skill indexers and
# `npx skills add` look for it. The wheel also needs it at the path
# package-bundled skills are discovered from, so copy it in at build time
# rather than keeping two copies in git.
[tool.hatch.build.targets.wheel.force-include]
"skills/sktime-cli/SKILL.md" = "sktime_cli/.agents/skills/sktime-cli/SKILL.md"

[tool.pytest.ini_options]
addopts = "-m 'not network'"
markers = ["network: tests that download data from the internet"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["D", "E", "W", "F", "S", "UP", "I002", "G010", "PLR1722", "RUF001", "RUF002", "RUF003"]
extend-select = ["I", "C4"]
ignore = ["E203", "E731", "C408", "S301"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S"]
"docs/**" = ["S"]
"src/sktime_cli/_specs.py" = ["S307"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

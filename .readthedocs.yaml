# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    # Installing with pip (not uv) is deliberate: [tool.uv.sources] points
    # sktime at a sibling checkout that does not exist on Read the Docs, and
    # pip ignores that table, so sktime resolves from PyPI.
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - htmlzip
